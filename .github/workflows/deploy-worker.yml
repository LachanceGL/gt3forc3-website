name: Deploy Worker

# MANUAL ONLY. The push trigger was removed on 2026-08-26 after the first
# automated deploy took the live Worker down: all seven credentials
# disappeared, and every API-keyed route plus /discord/stats returned 401
# until a dashboard rollback restored them. The public /rows endpoint,
# which needs no key, kept working throughout -- that split is what
# identified it as missing credentials rather than bad code.
#
# The cause is NOT yet understood. The obvious explanation is that the
# values were plaintext environment variables, which `wrangler deploy`
# deletes when the config declares no [vars] -- but after the rollback
# they present as encrypted secrets, and secrets are supposed to survive a
# deploy untouched. Those two facts don't reconcile, so the real mechanism
# is still unknown.
#
# DO NOT restore the push trigger until it is. Running this workflow will
# most likely repeat the outage. If you need to deploy, verify first that
# every credential is stored as a Secret (not a Variable), and be ready to
# roll back from Workers > raspy-salad-d894 > Deployments.
#
# Worth knowing: the rollback restored the credentials WITHOUT reverting
# the edge-caching code, so nothing was lost that time.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys of the same Worker overlap. cancel-in-progress is
# false on purpose: cancelling a half-finished deploy is worse than
# queueing behind it.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fail early and legibly if the token was never added, rather than
      # letting wrangler fail with an auth error that reads like the config
      # is broken.
      - name: Check credentials are present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repo."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "Create the token in Cloudflare with the 'Edit Cloudflare Workers' template."
            exit 1
          fi

      # Deploys workers.js as configured by wrangler.toml. Secrets already
      # set on the Worker (DISCORD_BOT_TOKEN, ADMIN_SECRET, ASSETTO_API_KEY
      # and _2 through _5) are NOT touched by a deploy -- they live on the
      # Worker, not in this repo, and must stay that way.
      #
      # NOTE: this replaces the ENTIRE script, including /contact, which
      # belongs to forc3mod.com. That is safe only while this repo stays the
      # single source of truth for the Worker. If anyone edits it in the
      # Cloudflare dashboard again, the next run here silently reverts them.
      # See wrangler.toml's header for the full consumer map.
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
