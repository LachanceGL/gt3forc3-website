name: Rebuild driver index

# Hourly. This file only builds the driver/nation index now, which moves
# only when a new DRIVER appears -- rare enough that a tighter schedule
# would buy nothing.
#
# It ran every 15 minutes between 2026-09-12 and 2026-09-23, while it also
# rebuilt the leaderboards and staleness was visible on the site. Worth
# knowing if that ever comes back: GitHub does NOT honour a schedule like
# that. It treats `schedule` as best-effort and drops runs under load, and
# measured over 36 hours a 15-minute cron produced runs 2.4 to 5.5 hours
# apart. The fix would be an external trigger calling workflow_dispatch,
# not a tighter cron here.
#
# workflow_dispatch is here so the index can be rebuilt on demand after a
# server is added or rebranded, without waiting for the hour.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Least privilege: the job only needs to push the regenerated file.
permissions:
  contents: write

# A run started while the previous one is still going would race on the
# same file and the same branch. Queue instead, and don't cancel a run
# mid-push.
concurrency:
  group: driver-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No pip install step on purpose -- the script deliberately uses only
      # the standard library, so there's nothing to resolve, pin or break.
      - name: Rebuild the index
        run: python scripts/build_driver_index.py --out data/driver-index.json

      # Accumulating archive of every valid lap ever seen, so a leaderboard
      # losing entries upstream stops being data loss. Incremental: it reads
      # only sessions newer than its stored cursor, so this is seconds once
      # the first run has walked the history -- unlike the index above,
      # which has to rebuild fully every time.
      #
      # Runs even if the index step failed. The index refuses to write a
      # partial file and exits 1 when any session fetch fails, which on
      # 2026-10-13 was 7 of 1606 transient timeouts -- and that skipped this
      # step entirely. Wrong way round: the archive is the one thing that
      # must not miss a session, and it is independent of the index.
      - name: Update the all-time record
        if: ${{ !cancelled() }}
        run: python scripts/build_all_time.py --out data/all-time.json

      # Commit ONLY when the content actually changed, so the repo doesn't
      # take an empty 1.1MB commit every hour forever. Most hours nothing
      # will have: a new session appears constantly, but a new *driver*
      # does not, and only drivers affect the index.
      #
      # all-time.json moves more often -- any new personal best touches it --
      # but it too rewrites only on a real change, so quiet hours stay
      # commit-free.
      # Also runs after a failed step, so whatever DID rebuild still gets
      # committed. A script that fails writes nothing, so there is never a
      # half-built file to commit here. The job still reports failure, so a
      # real problem is still visible.
      - name: Commit if changed
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- data/driver-index.json data/all-time.json; then
            echo "No change to the derived data; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/driver-index.json data/all-time.json
          git commit -m "Rebuild driver index

          Automated rebuild via .github/workflows/driver-index.yml.
          Committed only because the content actually changed."
          # Rebase rather than force: a human push landing between the
          # checkout and this push must not be discarded by a bot job.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
